[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "continual_vnd"
version = "0.1.0"
description = "Continual Learning via Variational Neural Dynamics for POMDPs"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "gymnasium>=0.29.0",
    "matplotlib>=3.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
]
